# What the web build may not call (tools/web_hazards.py, web/README.md "Checks"): std's file system,
# clocks, environment and threads either fail or panic in a browser, and a page's thread may not
# block. Each has a horizon_platform counterpart (fs, time, env, thread, sync). Calls that run only
# natively are listed in web/hazards.json; a new one fails the check.
disallowed-methods = [
  "std::path::Path::exists",
  "std::path::Path::is_dir",
  "std::path::Path::is_file",
  "std::path::Path::metadata",
  "std::path::Path::symlink_metadata",
  "std::path::Path::read_dir",
  "std::path::Path::canonicalize",
  "std::path::Path::try_exists",
  "std::path::Path::read_link",
  "std::path::absolute",
  "std::process::id",
  "std::process::exit",
  "std::fs::read",
  "std::fs::write",
  "std::fs::read_to_string",
  "std::fs::read_dir",
  "std::fs::create_dir_all",
  "std::fs::remove_file",
  "std::fs::remove_dir_all",
  "std::fs::metadata",
  "std::fs::rename",
  "std::fs::File::open",
  "std::fs::File::create",
  "std::time::Instant::now",
  "std::time::SystemTime::now",
  "std::thread::spawn",
  "std::thread::sleep",
  "std::thread::scope",
  "std::thread::Builder::spawn",
  "std::env::current_dir",
  "std::env::var",
  "std::env::var_os",
  "std::env::args",
  "std::env::temp_dir",
  "std::env::current_exe",
  "std::sync::mpsc::Receiver::recv",
  "std::sync::mpsc::Receiver::recv_timeout",
  "std::sync::Condvar::wait",
  "std::sync::Condvar::wait_timeout",
  "std::sync::Condvar::wait_while",
  "std::thread::park_timeout",
  "std::thread::park",
  "pollster::block_on",
  "chrono::Local::now",
  "chrono::Utc::now",
]
