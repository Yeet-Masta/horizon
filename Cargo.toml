[workspace]
exclude = ["launcher", "crates/horizon-telemetry-server", "crates/horizon-mod-registry", "third_party/wgpu", "third_party/wgpu-core", "third_party/wgpu-hal", "third_party/wgpu-types"]
members = [
    "crates/horizon-core",
    "crates/horizon-platform",
    "crates/horizon-dualsense",
    "crates/horizon-threads",
    "crates/horizon-hdr",
    "crates/horizon-world",
    "crates/horizon-client",
    "crates/horizon-client-core",
    "crates/horizon-client-input",
    "crates/horizon-client-render",
    "crates/horizon-command",
    "crates/horizon-items",
    "crates/horizon-server-files",
    "crates/horizon-server",
    "crates/horizon-bots",
    "crates/horizon-assets",
    "crates/horizon-protocol",
    "crates/horizon-theme",
    "crates/horizon-prepare",
    "crates/horizon-telemetry",
    "crates/horizon-bench",
    "crates/horizon-friends",
    "crates/horizon-relay",
    "crates/horizon-web-relay",
    "crates/horizon-mods",
    "crates/cargo-horizon-mod",
    "crates/horizon-port-pack",
    "crates/horizon-shaders",
    "crates/horizon-shader-api",
    "crates/horizon-release-sign",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Ports mirror vanilla's Java signatures, index loops and nested generic types
# one to one so they can be checked against the decompiled sources.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

# wgpu-hal 30.0.1 with gfx-rs/wgpu#10124: wgpu 30 creates a Vulkan descriptor
# pool with no pool sizes while it creates the device, which Vulkan allows only
# since 1.3.215, and Intel's Windows driver for 6th-10th gen iGPUs (HD 520/530,
# UHD 620/630) crashes on it with an access violation (#746). It also fixes the
# Metal backend's lookup of the CoreGraphics HDR colour space names, which handed
# CoreGraphics a symbol's address as the string and crashed HDR output on macOS.
# Drop this and the folder once a wgpu release has both fixes.
#
# wgpu, wgpu-core and wgpu-types 30.0.1 (and wgpu-hal) with `target_arch = "wasm32"`
# read as `target_family = "wasm"`: wgpu 30 counts wasm64 as a native target, so
# the web build on wasm64-unknown-unknown (web/README.md) had no WebGPU backend.
#
# The wasm-bindgen family at a commit of its main branch: threads on memory64 (#5378), which
# the web build's workers need (web/README.md), aren't in a release yet. The CLI
# must be built from that commit (web/build.sh says how). Back to
# crates.io once a release has them.
[patch.crates-io]
wasm-bindgen = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "39ae823bbc14c9d0a4a2869361483b5453a9b133" }
wasm-bindgen-futures = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "39ae823bbc14c9d0a4a2869361483b5453a9b133" }
js-sys = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "39ae823bbc14c9d0a4a2869361483b5453a9b133" }
web-sys = { git = "https://github.com/wasm-bindgen/wasm-bindgen", rev = "39ae823bbc14c9d0a4a2869361483b5453a9b133" }
wgpu = { path = "third_party/wgpu" }
wgpu-core = { path = "third_party/wgpu-core" }
wgpu-hal = { path = "third_party/wgpu-hal" }
wgpu-types = { path = "third_party/wgpu-types" }

# Line tables keep file:line in backtraces; full debug info made every
# example and test binary hundreds of megabytes and slow to link.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
