[package]
name = "horizon-web-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The web build's way to Minecraft servers (a browser's WebSocket in, TCP out) and to friends' browsers (WebRTC introductions)"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
sha1 = "0.10"
# Minecraft's SRV redirects, as the game follows them.
horizon-protocol = { path = "../horizon-protocol" }
# Server resource packs for pages whose fetch the pack's server refuses (CORS).
ureq = { version = "2", default-features = false, features = ["tls"] }

[[bin]]
name = "horizon-web-relay"
path = "src/main.rs"

[lints]
workspace = true
